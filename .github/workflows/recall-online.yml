name: Recall Online

on:
  push:
    branches: [recall-online]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: recall-online.gmrodrigues.com
      url: https://recall-online.gmrodrigues.com
    concurrency:
      group: recall-online.gmrodrigues.com
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test && bash online/smoke.sh
      - name: Deploy Worker and apply D1 migration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RECALL_D1_DATABASE_ID: ${{ vars.RECALL_D1_DATABASE_ID }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing Cloudflare account ID}"
          : "${CLOUDFLARE_API_TOKEN:?Missing Cloudflare API token}"
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from "node:fs";
          const id = process.env.RECALL_D1_DATABASE_ID;
          if (!id || !/^[a-f0-9-]{36}$/i.test(id) || /^0{8}-0{4}-0{4}-0{4}-0{12}$/.test(id)) {
            throw new Error("Invalid RECALL_D1_DATABASE_ID");
          }
          const config = JSON.parse(readFileSync("online/wrangler.jsonc", "utf8"));
          config.d1_databases[0].database_id = id;
          config.vars = { DEPLOY_SHA: process.env.GITHUB_SHA };
          writeFileSync("online/wrangler.deploy.json", JSON.stringify(config));
          JS
          npx --no-install wrangler d1 migrations apply DB --remote --config online/wrangler.deploy.json
          npx --no-install wrangler deploy --config online/wrangler.deploy.json
      - name: Verify deployed revision and D1
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 \
              https://recall-online.gmrodrigues.com/health -o "$RUNNER_TEMP/recall-health.json" &&
              jq -e --arg sha "$GITHUB_SHA" '.sha == $sha and .d1 == "ok"' "$RUNNER_TEMP/recall-health.json"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
